<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edusphere Sidebar</title>

    <link rel="stylesheet" href="../assets/css/sidebar.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body>

    <button class="menu-toggle" id="menuToggle">
        <i class="fa-solid fa-bars" id="menuIcon"></i>
    </button>

    <aside class="sidebar" id="sidebar">

        <div class="sidebar-brand">
            <div class="brand-icon">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>

            <span>Edusphere</span>
        </div>

        <nav class="sidebar-nav">

            <a href="../pages/dashboards/student_dashboard.html">
                <i class="fa-solid fa-house"></i>
                <span>Dashboard</span>
            </a>

            <a href="../pages/grids/profile.html">
                <i class="fa-regular fa-user"></i>
                <span>Profile</span>
            </a>

            <a href="../pages/grids/attendance.html">
                <i class="fa-solid fa-calendar-check"></i>
                <span>Attendance</span>
            </a>

            <a href="../pages/grids/syllabus.html">
                <i class="fa-solid fa-book"></i>
                <span>Syllabus</span>
            </a>

            <a href="../pages/grids/timetable.html">
                <i class="fa-solid fa-calendar-days"></i>
                <span>Timetable</span>
            </a>

            <a href="../pages/grids/assignments.html">
                <i class="fa-solid fa-list-check"></i>
                <span>Assignments</span>
            </a>

            <a href="../pages/grids/results.html">
                <i class="fa-solid fa-chart-column"></i>
                <span>Results</span>
            </a>

            <a href="../pages/grids/question_papers.html">
                <i class="fa-solid fa-file-lines"></i>
                <span>Question Papers</span>
            </a>

            <a href="../pages/grids/events.html">
                <i class="fa-regular fa-calendar"></i>
                <span>Events</span>
            </a>

            <a href="../pages/grids/academic_calendar.html">
                <i class="fa-solid fa-calendar-week"></i>
                <span>Academic Calendar</span>
            </a>

            <a href="../pages/grids/company_visit.html">
                <i class="fa-solid fa-building"></i>
                <span>Company Visits</span>
            </a>

        </nav>

    </aside>

    <script>
        const sidebar = document.getElementById("sidebar");
        const menuToggle = document.getElementById("menuToggle");
        const menuIcon = document.getElementById("menuIcon");

        menuToggle.addEventListener("click", function () {
            sidebar.classList.toggle("active");

            if (sidebar.classList.contains("active")) {
                menuIcon.classList.remove("fa-bars");
                menuIcon.classList.add("fa-xmark");
            } else {
                menuIcon.classList.remove("fa-xmark");
                menuIcon.classList.add("fa-bars");
            }
        });
    </script>

</body>
</html>
